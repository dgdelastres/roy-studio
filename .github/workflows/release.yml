name: Release ROY Studio

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm install

      - name: Verificación de Tipos y Tests
        run: |
          npm run typecheck
          npm run test

      - name: Compilar Frontend Web
        run: npm run build

      - name: Compilar Distribución Windows (Instalador, Portable y ZIP)
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar Release Oficial con Ejecutable y Archivos Adjuntos
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-win/*.exe
            dist-win/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
