name: Release PILPIS Vessel Studio

on:
  push:
    tags:
      - 'v*-recipientes'
      - 'vessel-*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm install

      - name: Verificación de Tipos y Tests
        run: |
          npm run typecheck
          npm run test

      - name: Compilar Frontend Web
        run: npm run build

      - name: Compilar Ejecutable Portable (Electron Builder)
        run: npx electron-builder --win portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar Release Oficial con Ejecutable Adjunto
        uses: softprops/action-gh-release@v2
        with:
          name: PILPIS Vessel Studio v1.0.0 (ASME VIII Div. 1)
          files: dist-win/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
